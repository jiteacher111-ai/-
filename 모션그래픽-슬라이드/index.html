<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>100% 무료 모션그래픽</title>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/player@0.9.16/dist/hyperframes-player.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/player@0.9.16/dist/slideshow/hyperframes-slideshow.global.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
    </style>
  </head>
  <body>
    <hyperframes-slideshow tabindex="0" style="display: block; position: relative; width: 100vw; height: 100vh">
      <hyperframes-player interactive style="position: absolute; inset: 0" src="composition/index.html"></hyperframes-player>
      <!-- composition/index.html 의 슬라이드쇼 아일랜드와 같은 내용이어야 합니다 -->
      <script type="application/hyperframes-slideshow+json">
      {
        "slides": [
          { "sceneId": "cover", "notes": "오늘 예제는 완전히 무료입니다. 수업 자료, 회사 발표, 아내에게 줄 결혼 이야기까지 만들어 봅니다." },
          { "sceneId": "why", "notes": "유료로 다 구독하면 한 달에 최소 10만 원. Claude 유료도 몇 번 만들면 토큰이 떨어져 5시간을 기다려야 합니다." },
          { "sceneId": "tradeoff", "fragments": [12.1, 12.5], "notes": "무료로 하면 스타일을 세세하게 지정할수록 퀄리티가 떨어집니다. 스타일은 AI에게 맡기는 게 핵심입니다." },
          { "sceneId": "tools", "fragments": [18.1, 18.4, 18.7], "notes": "링크를 눌러 회원 가입만 해 두면 준비 끝입니다." },
          { "sceneId": "flow", "notes": "나레이션 없이 만드는 건 금방 합니다. 활용 범위가 넓은 '나레이션 있는 영상'을 기준으로 설명합니다." },
          { "sceneId": "step1", "notes": "아르곤 같은 최신 모델은 유료 전용이라 선택해도 쓸 수 없습니다. 무료로 쓸 수 있는 Flash 모델을 고르세요." },
          { "sceneId": "step2", "fragments": [36.1, 36.5], "notes": "기본 설정만으로는 조금 어색합니다. 감정·분위기 칸에 '밝은 나레이션 톤' 프롬프트를 넣으면 느낌이 확 달라집니다." },
          { "sceneId": "step3", "notes": "Claude가 몇 초에 어떤 말이 나오는지 알아야 화면을 맞출 수 있습니다. 그래서 SRT 자막 파일이 꼭 필요합니다." },
          { "sceneId": "step4", "notes": "예전엔 AI Studio에서도 음악을 만들 수 있었지만 지금은 유료 전용입니다. 음악은 Gemini 앱에서 무료로 만듭니다." },
          { "sceneId": "step5", "notes": "이 설정을 켜야 Claude가 웹에서 외부 소스(폰트 등)를 받아 작업할 수 있습니다." },
          { "sceneId": "step6", "notes": "준비한 프롬프트에서 주제만 바꾸세요. 무료 버전에서는 스타일을 지정하지 않고 AI에게 위임하는 것이 결과가 더 좋습니다." },
          { "sceneId": "step7", "notes": "결과물은 영상이 아니라 웹페이지입니다. 카카오톡이나 구글 드라이브에 올려 두고 파워포인트처럼 쓰면 됩니다." },
          { "sceneId": "step8", "notes": "녹화 전에 마우스 커서를 화면 밖으로 치워 두세요. Clipchamp는 구독 없이 기본 편집이 됩니다." },
          { "sceneId": "ex2", "notes": "엑셀 범위를 그냥 붙여 넣으면 그림으로 들어갑니다. Ctrl+Shift+V로 값만 붙여 넣으세요." },
          { "sceneId": "ex3", "notes": "무료 이미지 모델은 투명 배경을 잘 못 만듭니다. 그래서 크로마키 녹색 배경으로 만들고 Claude에게 지워 달라고 합니다." },
          { "sceneId": "tips", "notes": "먼저 무료로 해 보고 자신감을 얻은 뒤, 더 높은 퀄리티가 필요하면 그때 유료를 고민하세요." },
          { "sceneId": "summary", "notes": "소스는 구글 무료 도구, 모션은 Claude 무료 버전. 비용 0원." }
        ]
      }
    </script>
    </hyperframes-slideshow>
    <script>
      document.querySelector("hyperframes-slideshow").focus();
    </script>
  </body>
</html>
