<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>어휘 땅따먹기 — 우리 반의 영토 전쟁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sea:#0c3a52; --sea2:#0a2d40;
    --parchment:#f3e6c8; --parchment2:#ead5a8; --wood:#6b4423; --wood-dark:#4a2f18;
    --ink:#3a2a1a; --ink-muted:#8a7355;
    --teal:#1aa6a6; --teal-dark:#0d7373;
    --gold:#f0b429; --gold-dark:#b9821a;
    --danger:#d9453d; --ok:#2fa860;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 0%,var(--sea),var(--sea2) 75%);
    color:var(--ink);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;
  }
  .jua{font-family:'Jua',sans-serif;}
  #app{position:relative;max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}
  .pad{padding:20px 18px 40px;}

  .btn{
    font-family:'Jua',sans-serif;font-size:15px;color:#fff;background:linear-gradient(180deg,#2bc4c4,var(--teal));
    border:none;border-radius:12px;padding:13px 18px;cursor:pointer;box-shadow:0 4px 0 var(--teal-dark),0 6px 14px rgba(0,0,0,.3);
    transition:transform .12s;letter-spacing:.3px;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-dark);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-gold{background:linear-gradient(180deg,#ffd873,var(--gold));color:#3a2a10;box-shadow:0 4px 0 var(--gold-dark),0 6px 14px rgba(0,0,0,.3);}
  .btn-ghost{background:transparent;border:1.5px solid var(--parchment2);color:var(--parchment);box-shadow:none;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:13px;padding:9px 14px;}
  .btn-wide{width:100%;}
  .btn-sm{padding:8px 12px;font-size:12px;}

  /* ── LOADING ── */
  #loading{align-items:center;justify-content:center;text-align:center;gap:16px;color:var(--parchment);}
  .spinner{width:50px;height:50px;border-radius:50%;border:5px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .load-err{color:#ffd0ce;font-size:13px;max-width:480px;line-height:1.6;background:rgba(217,69,61,.18);border:1px solid rgba(217,69,61,.5);border-radius:10px;padding:16px;text-align:left;}

  /* ── TITLE / LOBBY ── */
  #title{align-items:center;justify-content:center;text-align:center;gap:10px;}
  .title-sub{color:var(--parchment);font-size:12px;letter-spacing:2px;opacity:.8;}
  .title-main{font-size:clamp(40px,10vw,64px);color:var(--gold);text-shadow:0 4px 0 var(--gold-dark),0 8px 20px rgba(0,0,0,.4);}
  .title-desc{color:var(--parchment2);font-size:13px;margin-bottom:10px;}
  .card{background:var(--parchment);border:3px solid var(--wood);border-radius:18px;padding:24px 22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .card h2{font-size:18px;text-align:center;}
  .field label{display:block;font-size:11px;color:var(--ink-muted);margin-bottom:6px;font-weight:700;}
  .field input, .field select{
    width:100%;background:#fffdf5;border:1.5px solid var(--parchment2);color:var(--ink);font-family:'Jua',sans-serif;
    font-size:17px;padding:11px 12px;border-radius:10px;outline:none;text-align:center;
  }
  .field input:focus, .field select:focus{border-color:var(--teal);}
  .row-gap{display:flex;gap:10px;}
  .row-gap > *{flex:1;}
  .hint{font-size:11px;color:var(--ink-muted);text-align:center;}
  .err-msg{font-size:12px;color:var(--danger);text-align:center;min-height:16px;}
  .divider{display:flex;align-items:center;gap:10px;color:var(--ink-muted);font-size:11px;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--parchment2);}
  .back-link{color:var(--parchment2);font-size:12px;text-align:center;cursor:pointer;text-decoration:underline;}

  .team-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .team-opt{
    border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;border:2.5px solid transparent;
    font-family:'Jua',sans-serif;font-size:12px;color:#fff;opacity:.55;
  }
  .team-opt.picked{opacity:1;border-color:var(--wood);transform:scale(1.04);}
  .team-opt .cnt{display:block;font-size:10px;font-weight:400;opacity:.85;margin-top:2px;}

  /* ── BOARD HEADER ── */
  #boardHeader{
    background:var(--wood-dark);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    border-bottom:3px solid var(--wood);
  }
  .room-chip{font-family:'Jua',sans-serif;color:var(--gold);font-size:13px;letter-spacing:2px;cursor:pointer;}
  .timer-chip{font-family:'Jua',sans-serif;color:#fff;font-size:14px;background:rgba(0,0,0,.25);padding:5px 12px;border-radius:20px;}
  .timer-chip.low{color:#ffb3b3;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .online-chip{color:var(--parchment2);font-size:11px;margin-left:auto;}
  .gear-btn{background:none;border:none;color:var(--parchment);font-size:18px;cursor:pointer;}

  .score-bar{display:flex;height:22px;border-radius:12px;overflow:hidden;margin:0 14px 8px;border:2px solid var(--wood-dark);background:#2a2015;}
  .score-seg{display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-family:'Jua',sans-serif;transition:width .4s;white-space:nowrap;overflow:hidden;}

  .my-team-chip{display:flex;align-items:center;gap:8px;margin:0 14px 10px;font-size:12px;color:var(--parchment);}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid rgba(255,255,255,.6);}

  /* ── MAP ── */
  #mapWrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:10px;touch-action:pan-x pan-y;}
  #mapInner{transition:transform .15s;transform-origin:top center;}
  .hex{cursor:pointer;stroke:#2a2015;stroke-width:1.5;}
  .hex.mine{cursor:default;}
  .hex.home{stroke:var(--gold);stroke-width:3;}
  .hex-label{font-family:'Jua',sans-serif;font-size:9px;fill:#fff;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .zoom-ctrl{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:30;}
  .zoom-ctrl button{
    width:42px;height:42px;border-radius:50%;background:var(--wood);color:var(--parchment);border:2px solid var(--gold);
    font-size:18px;cursor:pointer;
  }

  /* ── MODAL (quiz / settings / end) ── */
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,10,20,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px;}
  .modal-backdrop.active{display:flex;}
  .modal{background:var(--parchment);border:3px solid var(--wood);border-radius:18px;padding:22px 20px;width:100%;max-width:420px;max-height:88vh;overflow:auto;}
  .modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-title{font-size:16px;}
  .modal-close{background:var(--danger);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;}
  .zone-name{font-size:13px;color:var(--ink-muted);margin-bottom:4px;}
  .zone-owner{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:14px;font-weight:700;}
  .defense-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .shield{
    background:var(--wood);color:var(--parchment);border-radius:10px;padding:6px 12px;font-family:'Jua',sans-serif;font-size:15px;
    display:flex;align-items:center;gap:4px;
  }
  .defense-desc{font-size:12px;color:var(--ink-muted);}
  .point-badge{background:var(--teal);color:#fff;font-family:'Jua',sans-serif;font-size:12px;padding:5px 10px;border-radius:8px;display:inline-block;margin-bottom:10px;}

  .q-word-box{background:#fffdf5;border:1.5px solid var(--parchment2);border-radius:12px;padding:18px;text-align:center;margin-bottom:14px;}
  .q-word{font-family:'Jua',sans-serif;font-size:28px;color:var(--ink);}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .opt-btn{
    background:#fffdf5;border:1.5px solid var(--parchment2);border-radius:10px;padding:11px 9px;font-size:13px;
    line-height:1.4;cursor:pointer;text-align:left;color:var(--ink);min-height:58px;display:flex;align-items:center;
  }
  .opt-btn.correct{border-color:var(--ok);background:rgba(47,168,96,.18);}
  .opt-btn.wrong{border-color:var(--danger);background:rgba(217,69,61,.18);}
  .opt-btn[disabled]{cursor:default;}
  @media (max-width:420px){.opt-grid{grid-template-columns:1fr;}}
  .q-feedback{min-height:20px;text-align:center;font-size:13px;font-family:'Jua',sans-serif;margin-top:10px;}
  .q-feedback.ok{color:var(--ok);}
  .q-feedback.bad{color:var(--danger);}
  .record-line{font-size:11px;color:var(--ink-muted);text-align:center;margin-top:12px;}

  /* ── END OVERLAY ── */
  .rank-row{display:flex;align-items:center;gap:10px;background:#fffdf5;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .rank-no{font-family:'Jua',sans-serif;width:22px;text-align:center;}
  .rank-bar-wrap{flex:1;height:10px;background:var(--parchment2);border-radius:6px;overflow:hidden;}
  .rank-bar{height:100%;}
  .rank-pct{font-family:'Jua',sans-serif;font-size:12px;width:44px;text-align:right;}

  footer{text-align:center;color:var(--parchment2);font-size:11px;padding:10px;opacity:.7;}
</style>
</head>
<body>
<div id="app">

  <div id="loading" class="screen active pad">
    <div class="spinner"></div>
    <div class="jua" style="font-size:18px;">어휘 땅을 불러오는 중...</div>

  <div id="title" class="screen pad">

    <div class="title-desc">낱말을 풀고, 우리 모둠의 땅을 넓혀요.</div>
    <div class="card">

        <select id="teamCountSel">

  <div id="playerScreen" class="screen pad" style="align-items:center;justify-content:center;">

  <div id="board" class="screen">
    <div id="boardHeader">
      <span class="room-chip" id="roomChipLabel" title="클릭하여 코드 복사">방 ────</span>
      <span class="timer-chip" id="timerChip">--:--</span>

  <!-- quiz modal -->
  <div class="modal-backdrop" id="quizBackdrop">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getDatabase, ref, set, get, update, onValue, off, runTransaction, onDisconnect
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

/* ========================================================================
   설정
   ======================================================================== */
const CONFIG = {
  SPREADSHEET_ID: '1s3Oc7TbPo6BmMhR2-NVKzSePpossJMUQjydLOdZisGs',
  SHEETS: { 국어: '국어', 사회: '사회', 과학: '과학' },
};
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAyCKv6g2o8r6uch11QKdqb13KTDNRC55k",
  authDomain: "alien-9d8d4.firebaseapp.com",
  databaseURL: "https://alien-9d8d4-default-rtdb.firebaseio.com",
  projectId: "alien-9d8d4",
};
const TEAM_COLORS = ['#d9453d','#2e7fd9','#2fa860','#e8902c','#8e5bd9','#1aa6a6'];
const TEAM_NAMES  = ['빨강팀','파랑팀','초록팀','주황팀','보라팀','청록팀'];
const GRID_RADIUS = 4;
const HEX_SIZE = 30;
const NEI = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const CAPTURE_RESET_DEFENSE = 3;
const MAX_DEFENSE = 12;
const PROTECTION_MS = 45000;
const DIFF_POINT = { easy: 1, normal: 1.5, hard: 2 };

let DB = {};
let db = null, roomRef = null, presenceRef = null;
let roomCode = null, myTeam = null, myName = null, mySubject = null;
let cellsCache = {}, teamsCache = {}, metaCache = {};
let wrongQueue = {};        // { subject: [word,...] }
let recentAsked = [];
let currentQuizCellId = null;
let timerInterval = null;
let gameEndedShown = false;

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows = []; let row = [], field = '', inQ = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQ){
      if (c === '"'){ if (text[i+1] === '"'){ field+='"'; i++; } else inQ=false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field=''; }
      else if (c === '\n') { row.push(field); rows.push(row); row=[]; field=''; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function normalizeDifficulty(v){
  v = (v||'').trim();
  if (v.includes('어려운')) return 'hard';
  if (v.includes('보통')) return 'normal';
  if (v.includes('쉬운')) return 'easy';
  return 'normal';
}
async function fetchSheet(subject, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`"${sheetName}" 시트를 불러오지 못했어요 (${res.status})`);
  const text = await res.text();
  if (/^<!DOCTYPE html/i.test(text.trim())) throw new Error(`"${sheetName}" 시트에 접근할 수 없어요 (공유 설정을 확인해주세요)`);
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const header = rows[0].map(h => (h||'').trim());
  const idx = { word: header.indexOf('날말'), diff: header.indexOf('난이도'), meaning: header.indexOf('뜻') };
  if (idx.word === -1 || idx.meaning === -1) throw new Error(`"${sheetName}" 시트에 "날말" 또는 "뜻" 열을 찾을 수 없어요`);
  const words = []; const seen = new Set();
  for (let i=1;i<rows.length;i++){
    const r = rows[i]; if (!r) continue;
    const word = (r[idx.word]||'').trim();
    const meaning = (r[idx.meaning]||'').trim();
    if (!word || !meaning) continue;
    const key = word+'|'+meaning;
    if (seen.has(key)) continue;
    seen.add(key);
    words.push({ word, meaning, subject, difficulty: normalizeDifficulty(idx.diff>-1 ? r[idx.diff] : '') });
  }
  return words;
}
async function loadAllData(){
  const errBox = document.getElementById('loadErrBox');
  errBox.innerHTML = '';
  const subjects = Object.keys(CONFIG.SHEETS);
  DB = {};
  for (const subj of subjects){
    try { DB[subj] = { all: await fetchSheet(subj, CONFIG.SHEETS[subj]) }; }
    catch (e){ DB[subj] = { all: [], error: e.message }; }
  }
  const allFailed = subjects.every(s => DB[s].all.length === 0);
  if (allFailed){
    const firstErr = subjects.map(s=>DB[s].error).find(Boolean) || '어휘를 하나도 불러오지 못했어요.';
    errBox.innerHTML = `<div class="load-err">⚠️ ${escapeHtml(firstErr)}<br><br>
      스프레드시트 공유 설정(링크가 있는 모든 사용자-뷰어)과 시트 이름(국어/사회/과학)을 확인해주세요.</div>
      <button class="btn btn-wide" id="retryBtn" style="margin-top:14px;">다시 시도</button>`;
    document.getElementById('retryBtn').onclick = boot;
    return false;
  }
  return true;
}

/* ---------- utils ---------- */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function genCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join(''); }

/* ---------- hex grid ---------- */
function axialToPixel(q,r,s){ return { x: s*Math.sqrt(3)*(q+r/2), y: s*1.5*r }; }
function hexCorners(cx,cy,s){
  const pts=[];
  for(let i=0;i<6;i++){
    const ang = Math.PI/180*(60*i-30);
    pts.push(`${(cx+s*Math.cos(ang)).toFixed(1)},${(cy+s*Math.sin(ang)).toFixed(1)}`);
  }
  return pts.join(' ');
}
function generateAxialCoords(N){
  const list=[];
  for(let q=-N;q<=N;q++){
    const r1=Math.max(-N,-q-N), r2=Math.min(N,-q+N);
    for(let r=r1;r<=r2;r++) list.push([q,r]);
  }
  return list;
}
function pickCorners(k,N){
  const corners=[[N,0],[N,-N],[0,-N],[-N,0],[-N,N],[0,N]];
  const used=new Set(); const result=[];
  for(let i=0;i<k;i++){
    let idx=Math.round(i*6/k)%6;
    while(used.has(idx)) idx=(idx+1)%6;
    used.add(idx); result.push(corners[idx]);
  }
  return result;
}
function buildInitialCells(teamCount){
  const coords = generateAxialCoords(GRID_RADIUS);
  const cells = {};
  let zi = 0;
  coords.forEach(([q,r])=>{
    zi++;
    cells[`${q}_${r}`] = { owner:null, defense:3+Math.floor(Math.random()*3), home:false, capturedAt:0, totalCorrect:0, zone: zi };
  });
  const homes = pickCorners(teamCount, GRID_RADIUS);
  homes.forEach(([hq,hr], teamIdx)=>{
    const key = `${hq}_${hr}`;
    cells[key] = { owner:teamIdx, defense:MAX_DEFENSE, home:true, capturedAt:0, totalCorrect:0, zone: cells[key].zone };
    NEI.forEach(([dq,dr])=>{
      const nk = `${hq+dq}_${hr+dr}`;
      if (cells[nk] && !cells[nk].home){
        cells[nk] = { owner:teamIdx, defense:6, home:false, capturedAt:0, totalCorrect:0, zone: cells[nk].zone };
      }
    });
  });
  return cells;
}
function neighborsOf(q,r){ return NEI.map(([dq,dr])=>`${q+dq}_${r+dr}`); }

/* ---------- Firebase ---------- */
async function initFirebase(){
  if (db) return true;
  try { const app = initializeApp(FIREBASE_CONFIG); db = getDatabase(app); return true; }
  catch(e){ console.warn('firebase init fail', e); return false; }
}
async function createRoom(teamCount, durationMin){
  const code = genCode();
  const teams = {};
  for (let i=0;i<teamCount;i++) teams[i] = { name: TEAM_NAMES[i], color: TEAM_COLORS[i] };
  const now = Date.now();
  const state = {
    meta: { teamCount, durationMin, startedAt: now, endsAt: now + durationMin*60000, gridRadius: GRID_RADIUS },
    teams,
    cells: buildInitialCells(teamCount),
  };
  await set(ref(db, `ddang/${code}`), state);
  return code;
}
async function roomExists(code){
  const snap = await get(ref(db, `ddang/${code}/meta`));
  return snap.exists();
}
function listenRoom(code){
  roomRef = ref(db, `ddang/${code}`);
  return new Promise(resolve => {
    onValue(roomRef, snap => {
      const data = snap.val();
      if (!data) return;
      metaCache = data.meta || {};
      teamsCache = data.teams || {};
      cellsCache = data.cells || {};
      resolve();
      if (document.getElementById('board').classList.contains('active')) renderBoard();
    });
  });
}
const hasOwner = c => c.owner !== null && c.owner !== undefined;
function presenceJoin(code, name){
  const pRef = ref(db, `ddang/${code}/players/${Date.now()}_${Math.random().toString(36).slice(2,7)}`);
  set(pRef, { name, ts: Date.now() });
  onDisconnect(pRef).remove();
  presenceRef = ref(db, `ddang/${code}/players`);
  onValue(presenceRef, snap => {
    const n = snap.exists() ? Object.keys(snap.val()).length : 0;
    document.getElementById('onlineChip').textContent = `👥 ${n}`;
  });
}

/* capture/defend transaction */
function applyAnswer(cellId, pointValue){
  const cRef = ref(db, `ddang/${roomCode}/cells/${cellId}`);
  return runTransaction(cRef, (cell) => {
    if (!cell) return cell;
    if (cell.home) return;
    if (cell.owner === myTeam){
      cell.defense = Math.min(MAX_DEFENSE, (cell.defense||0) + pointValue);
      cell.totalCorrect = (cell.totalCorrect||0) + 1;
      return cell;
    }
    // attacking neutral or enemy
    if (cell.capturedAt && Date.now() - cell.capturedAt < PROTECTION_MS) return;
    cell.defense = (cell.defense||0) - pointValue;
    cell.totalCorrect = (cell.totalCorrect||0) + 1;
    if (cell.defense <= 0){
      cell.owner = myTeam;
      cell.defense = CAPTURE_RESET_DEFENSE;
      cell.capturedAt = Date.now();
    }
    return cell;
  });
}

/* ---------- lobby flow ---------- */
function initTitle(){
  document.getElementById('goCreateBtn').onclick = () => showScreen('createScreen');
  document.getElementById('goJoinBtn').onclick = async () => {
    const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
    const errEl = document.getElementById('titleErr');
    if (code.length !== 4){ errEl.textContent = '방 코드는 4자리입니다.'; return; }
    errEl.textContent = '';
    const ok = await initFirebase();
    if (!ok){ errEl.textContent = '서버 연결에 실패했어요.'; return; }
    const exists = await roomExists(code);
    if (!exists){ errEl.textContent = '방을 찾을 수 없습니다. 코드를 확인해주세요.'; return; }
    roomCode = code;
    await listenRoom(code);
    openPlayerScreen();
  };
  document.getElementById('backFromCreate').onclick = () => showScreen('title');
  document.getElementById('confirmCreateBtn').onclick = async () => {
    const teamCount = parseInt(document.getElementById('teamCountSel').value,10);
    const durationMin = parseInt(document.getElementById('durationSel').value,10);
    const ok = await initFirebase();
    if (!ok){ alert('서버 연결에 실패했어요.'); return; }
    roomCode = await createRoom(teamCount, durationMin);
    await listenRoom(roomCode);
    openPlayerScreen();
  };
  document.getElementById('backFromPlayer').onclick = () => { showScreen('title'); };
}

function openPlayerScreen(){
  const subjSel = document.getElementById('subjectSel');
  subjSel.innerHTML = Object.keys(CONFIG.SHEETS).map(s=>`<option value="${s}">${s}</option>`).join('');
  showScreen('playerScreen');
  const pick = document.getElementById('teamPick');
  pick.innerHTML = Object.keys(teamsCache).map(tid => {
    const t = teamsCache[tid];
    const cnt = Object.values(cellsCache).filter(c=>String(c.owner)===String(tid)).length;
    return `<div class="team-opt" data-team="${tid}" style="background:${t.color}">${escapeHtml(t.name)}<span class="cnt">${cnt}칸</span></div>`;
  }).join('');
  pick.querySelectorAll('.team-opt').forEach((el,i)=>{
    if (i===0) el.classList.add('picked');
    el.onclick = () => { pick.querySelectorAll('.team-opt').forEach(x=>x.classList.remove('picked')); el.classList.add('picked'); };
  });
  document.getElementById('enterBoardBtn').onclick = () => {
    const name = document.getElementById('playerNameInput').value.trim();
    const errEl = document.getElementById('playerErr');
    if (!name){ errEl.textContent = '이름을 입력해주세요.'; return; }
    const picked = document.querySelector('#teamPick .team-opt.picked');
    if (!picked){ errEl.textContent = '모둠을 선택해주세요.'; return; }
    myName = name; myTeam = parseInt(picked.dataset.team,10); mySubject = subjSel.value;
    presenceJoin(roomCode, name);
    enterBoard();
  };
}

/* ---------- board ---------- */
function enterBoard(){
  showScreen('board');
  document.getElementById('roomChipLabel').textContent = `방 ${roomCode}`;
  document.getElementById('roomChipLabel').onclick = () => {
    navigator.clipboard?.writeText(roomCode).catch(()=>{});
  };
  const subjSel2 = document.getElementById('subjectSel2');
  subjSel2.innerHTML = Object.keys(CONFIG.SHEETS).map(s=>`<option value="${s}">${s}</option>`).join('');
  subjSel2.value = mySubject;
  subjSel2.onchange = () => { mySubject = subjSel2.value; };
  document.getElementById('settingsNameLabel').textContent = `${myName} (${teamsCache[myTeam]?.name||''})`;
  document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsBackdrop').classList.add('active');
  document.getElementById('settingsCloseBtn').onclick = () => document.getElementById('settingsBackdrop').classList.remove('active');
  document.getElementById('leaveRoomBtn').onclick = leaveRoom;
  document.getElementById('endLeaveBtn').onclick = leaveRoom;
  document.getElementById('quizCloseBtn').onclick = closeQuiz;
  document.getElementById('zoomInBtn').onclick = () => setZoom(zoomLevel+0.2);
  document.getElementById('zoomOutBtn').onclick = () => setZoom(zoomLevel-0.2);
  document.getElementById('newRoundBtn').onclick = startNewRound;

  buildSvgSkeleton();
  renderBoard();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  tickTimer();
}
function leaveRoom(){
  if (roomRef) off(roomRef);
  if (presenceRef) off(presenceRef);
  roomRef = null; roomCode = null; myTeam = null;
  document.getElementById('settingsBackdrop').classList.remove('active');
  document.getElementById('endBackdrop').classList.remove('active');
  location.reload();
}

let zoomLevel = 1, mapBaseW = 0, mapBaseH = 0;
function setZoom(v){
  zoomLevel = Math.max(0.6, Math.min(2.2, v));
  const svg = document.getElementById('mapSvg');
  svg.setAttribute('width', mapBaseW*zoomLevel);
  svg.setAttribute('height', mapBaseH*zoomLevel);
}

let hexNodes = {}; // id -> {poly, label}
function buildSvgSkeleton(){
  const svg = document.getElementById('mapSvg');
  const coords = generateAxialCoords(GRID_RADIUS);
  const pts = coords.map(([q,r])=>axialToPixel(q,r,HEX_SIZE));
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const pad = HEX_SIZE*1.2;
  const minX=Math.min(...xs)-pad, maxX=Math.max(...xs)+pad, minY=Math.min(...ys)-pad, maxY=Math.max(...ys)+pad;
  const w = maxX-minX, h = maxY-minY;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  mapBaseW = w; mapBaseH = h;
  svg.innerHTML = '';
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  svg.appendChild(g);
  hexNodes = {};
  coords.forEach(([q,r])=>{
    const id = `${q}_${r}`;
    const {x,y} = axialToPixel(q,r,HEX_SIZE);
    const cx = x-minX, cy = y-minY;
    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points', hexCorners(cx,cy,HEX_SIZE-1));
    poly.classList.add('hex');
    poly.dataset.id = id; poly.dataset.q=q; poly.dataset.r=r;
    poly.onclick = () => onCellClick(id, q, r);
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x', cx); label.setAttribute('y', cy+3);
    label.setAttribute('text-anchor','middle');
    label.classList.add('hex-label');
    g.appendChild(poly); g.appendChild(label);
    hexNodes[id] = { poly, label };
  });
  const fit = Math.min(1.6, (document.getElementById('mapWrap').clientWidth - 20) / w);
  setZoom(fit > 0 ? fit : 1);
}
function isAdjacentToMine(q,r){
  return neighborsOf(q,r).some(nk => cellsCache[nk] && String(cellsCache[nk].owner)===String(myTeam));
}
function renderBoard(){
  if (!Object.keys(hexNodes).length) return;
  // score bar
  const total = Object.keys(cellsCache).length || 1;
  const teamIds = Object.keys(teamsCache);
  const counts = {}; teamIds.forEach(t=>counts[t]=0);
  Object.values(cellsCache).forEach(c=>{ if (c.owner!==null && c.owner!==undefined && counts[c.owner]!==undefined) counts[c.owner]++; });
  const scoreBar = document.getElementById('scoreBar');
  scoreBar.innerHTML = teamIds.map(t=>{
    const pct = Math.round(counts[t]/total*100);
    return `<div class="score-seg" style="width:${pct}%;background:${teamsCache[t].color}">${pct>7?teamsCache[t].name:''}</div>`;
  }).join('');
  if (myTeam!==null && teamsCache[myTeam]){
    document.getElementById('myTeamDot').style.background = teamsCache[myTeam].color;
    document.getElementById('myTeamLabel').textContent = `나: ${myName} · ${teamsCache[myTeam].name} (${counts[myTeam]||0}칸)`;
  }
  // hexes
  Object.entries(hexNodes).forEach(([id, node])=>{
    const cell = cellsCache[id];
    if (!cell) return;
    const [q,r] = id.split('_').map(Number);
    let fill = '#d8cdb0';
    if (hasOwner(cell) && teamsCache[cell.owner]) fill = teamsCache[cell.owner].color;
    node.poly.setAttribute('fill', fill);
    node.poly.classList.toggle('home', !!cell.home);
    const mine = String(cell.owner)===String(myTeam);
    node.poly.classList.toggle('mine', mine);
    const protectedNow = cell.capturedAt && (Date.now()-cell.capturedAt < PROTECTION_MS);
    const targetable = !cell.home && !mine && isAdjacentToMine(q,r) && !protectedNow;
    node.poly.style.opacity = (mine || targetable) ? '1' : '0.55';
    node.label.textContent = cell.home ? '★' : (protectedNow ? '🛡' : fmt(cell.defense));
  });
}
function fmt(n){ return n === undefined || n === null ? '' : String(Math.round(n*10)/10); }
function isOver(){ return metaCache.endsAt && Date.now() >= metaCache.endsAt; }
function tickTimer(){
  if (!metaCache.endsAt) return;
  const remain = metaCache.endsAt - Date.now();
  const chip = document.getElementById('timerChip');
  if (remain > 0 && gameEndedShown){
    gameEndedShown = false;
    document.getElementById('endBackdrop').classList.remove('active');
  }
  renderBoard();
  if (remain <= 0){
    chip.textContent = '종료!';
    chip.classList.add('low');
    if (!gameEndedShown){ gameEndedShown = true; showEndOverlay(); }
    return;
  }
  const m = Math.floor(remain/60000), s = Math.floor((remain%60000)/1000);
  chip.textContent = `⏱ ${m}:${String(s).padStart(2,'0')}`;
  chip.classList.toggle('low', remain < 60000);
}
function showEndOverlay(){
  const total = Object.keys(cellsCache).length || 1;
  const teamIds = Object.keys(teamsCache);
  const counts = {}; teamIds.forEach(t=>counts[t]=0);
  Object.values(cellsCache).forEach(c=>{ if (counts[c.owner]!==undefined) counts[c.owner]++; });
  const ranked = teamIds.map(t=>({t, name:teamsCache[t].name, color:teamsCache[t].color, cnt:counts[t]||0}))
    .sort((a,b)=>b.cnt-a.cnt);
  document.getElementById('rankList').innerHTML = ranked.map((r,i)=>{
    const pct = Math.round(r.cnt/total*100);
    return `<div class="rank-row"><span class="rank-no">${i+1}</span>
      <span class="dot" style="background:${r.color}"></span>
      <span style="flex:1;font-weight:700;">${escapeHtml(r.name)}</span>
      <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%;background:${r.color}"></div></div>
      <span class="rank-pct">${pct}%</span></div>`;
  }).join('');
  document.getElementById('endBackdrop').classList.add('active');
}
async function startNewRound(){
  const teamCount = Object.keys(teamsCache).length;
  const durationMin = metaCache.durationMin || 20;
  const now = Date.now();
  await update(ref(db, `ddang/${roomCode}`), {
    meta: { teamCount, durationMin, startedAt: now, endsAt: now + durationMin*60000, gridRadius: GRID_RADIUS },
    cells: buildInitialCells(teamCount),
  });
  gameEndedShown = false;
  document.getElementById('endBackdrop').classList.remove('active');
}

/* ---------- quiz ---------- */
function pickWord(){
  const pool = (DB[mySubject] && DB[mySubject].all) || [];
  if (!pool.length) return null;
  const wq = wrongQueue[mySubject] || [];
  if (wq.length && Math.random() < 0.4){
    const w = wq.shift();
    return pool.find(x=>x.word===w.word) || w;
  }
  const candidates = pool.filter(w=>!recentAsked.includes(w.word));
  const chosen = sample(candidates.length ? candidates : pool, 1)[0];
  recentAsked.push(chosen.word);
  if (recentAsked.length > 12) recentAsked.shift();
  return chosen;
}
function onCellClick(id, q, r){
  const cell = cellsCache[id];
  if (!cell || cell.home || isOver()) return;
  const mine = String(cell.owner)===String(myTeam);
  if (!mine && !isAdjacentToMine(q,r)) return;
  const protectedNow = cell.capturedAt && (Date.now()-cell.capturedAt < PROTECTION_MS);
  if (!mine && protectedNow) { return; }
  if (!(DB[mySubject] && DB[mySubject].all && DB[mySubject].all.length>=4)){ alert('이 과목은 어휘가 부족해요. 다른 과목을 선택해주세요.'); return; }
  openQuiz(id, mine);
}
function openQuiz(cellId, mine){
  currentQuizCellId = cellId;
  const cell = cellsCache[cellId];
  const w = pickWord();
  if (!w) return;
  document.getElementById('quizZoneName').textContent = `${cell.zone}구역`;
  const owned = hasOwner(cell) && teamsCache[cell.owner];
  document.getElementById('quizOwner').innerHTML = mine
    ? `<span class="dot" style="background:${teamsCache[myTeam].color}"></span> 우리 땅 지키기`
    : owned
      ? `<span class="dot" style="background:${owned.color}"></span> ${escapeHtml(owned.name)} 땅 공격하기`
      : `<span class="dot" style="background:#999"></span> 빈 땅 점령하기`;
  document.getElementById('quizShield').textContent = `🛡️ ${fmt(cell.defense)}`;
  document.getElementById('quizDesc').textContent = mine ? `정답 시 방어력 상승 (최대 ${MAX_DEFENSE})` : `방어력이 0이 되면 점령!`;
  const pv = DIFF_POINT[w.difficulty] ?? 1.5;
  document.getElementById('quizPointBadge').textContent = `${w.difficulty==='hard'?'어려운 어휘':w.difficulty==='easy'?'쉬운 어휘':'보통 어휘'} · 정답 시 ${mine?'+':'-'}${pv}`;
  document.getElementById('quizWord').textContent = w.word;
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizRecord').textContent = `이 땅 누적 정답 ${cell.totalCorrect||0}회`;

  const subjPool = DB[mySubject].all.filter(x=>x.word!==w.word);
  const distractors = sample(subjPool, Math.min(3, subjPool.length)).map(x=>x.meaning);
  while (distractors.length<3) distractors.push('（해당 없음）');
  const options = shuffle([w.meaning, ...distractors]);
  const wrap = document.getElementById('quizOptions');
  wrap.innerHTML = '';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.className='opt-btn'; b.textContent = opt;
    b.onclick = () => answerQuiz(b, opt, w, mine, pv, cellId);
    wrap.appendChild(b);
  });
  document.getElementById('quizBackdrop').classList.add('active');
}
async function answerQuiz(btn, chosen, w, mine, pv, cellId){
  document.querySelectorAll('#quizOptions .opt-btn').forEach(b=>b.disabled=true);
  const correct = chosen === w.meaning;
  const fb = document.getElementById('quizFeedback');
  if (correct){
    btn.classList.add('correct');
    fb.textContent = mine ? '✅ 방어 성공!' : '✅ 공격 성공!';
    fb.className = 'q-feedback ok';
    wrongQueue[w.subject] = (wrongQueue[w.subject]||[]).filter(x=>x.word!==w.word);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('#quizOptions .opt-btn').forEach(b=>{ if (b.textContent===w.meaning) b.classList.add('correct'); });
    fb.textContent = '❌ 아쉬워요! 다음에 또 만나요.';
    fb.className = 'q-feedback bad';
    wrongQueue[w.subject] = wrongQueue[w.subject] || [];
    if (!wrongQueue[w.subject].some(x=>x.word===w.word)) wrongQueue[w.subject].push(w);
  }
  if (correct){
    const res = await applyAnswer(cellId, pv).catch(()=>null);
    if (res && !res.committed){
      fb.textContent = '🛡 지금은 보호 중인 땅이라 반영되지 않았어요.';
      fb.className = 'q-feedback bad';
    }
  }
  setTimeout(closeQuiz, 1100);
}
function closeQuiz(){ document.getElementById('quizBackdrop').classList.remove('active'); currentQuizCellId = null; }

/* ---------- 부팅 ---------- */
async function boot(){
  showScreen('loading');
  const ok = await loadAllData();
  if (!ok) return;
  initTitle();
  showScreen('title');
}
boot();
